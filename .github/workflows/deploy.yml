name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        run: |
          API_IMAGE=ghcr.io/ayeolakenny/milestone/api
          docker build \
            -t $API_IMAGE:latest \
            -t $API_IMAGE:${{ github.sha }} .
          docker push $API_IMAGE:latest
          docker push $API_IMAGE:${{ github.sha }}
          docker rmi $API_IMAGE:latest $API_IMAGE:${{ github.sha }} || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Copy docker-compose.prod.yml to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "mkdir -p /home/${{ secrets.DROPLET_USER }}/app"
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/home/${{ secrets.DROPLET_USER }}/app/

      - name: Deploy to Droplet
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "
            cd /home/${{ secrets.DROPLET_USER }}/app

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            printf '%s\n' \
              'NODE_ENV=production' \
              'PORT=4000' \
              'POSTGRES_USER=${{ secrets.POSTGRES_USER }}' \
              'POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}' \
              'POSTGRES_DB=${{ secrets.POSTGRES_DB }}' \
              'DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}?schema=public&sslmode=disable' \
              'REDIS_URL=redis://redis:6379' \
              'PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}' \
              'PAYSTACK_TEST_RECIPIENT_CODE=${{ secrets.PAYSTACK_TEST_RECIPIENT_CODE }}' \
              'PAYSTACK_BASE_URL=${{ vars.PAYSTACK_BASE_URL }}' \
              'CASHBACK_AMOUNT_KOBO=${{ vars.CASHBACK_AMOUNT_KOBO }}' \
              > .env

            # Bring up postgres/redis if not already running (first deploy, or after a host reboot)
            docker compose -f docker-compose.prod.yml up -d postgres redis

            docker rmi ghcr.io/ayeolakenny/milestone/api:latest || true
            docker pull ghcr.io/ayeolakenny/milestone/api:latest
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            # Clean up dangling images/containers left behind by rebuilds (never prune volumes — postgres_data lives in one)
            docker image prune -f
            docker container prune -f

            docker ps
          "
